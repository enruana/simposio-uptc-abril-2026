<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Simposio Uptc Abril 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        :root {
            --color-primary: #00ffff; /* Cyan neon */
            --color-secondary: #ff00ff; /* Magenta neon */
            --color-background: #0a0a2a; /* Deep blue/black */
            --color-text: #cceeff; /* Light blue text */
            --shadow-glow: 0 0 10px var(--color-primary), 0 0 20px var(--color-primary);
        }

        body {
            background-color: var(--color-background);
            color: var(--color-text);
            font-family: 'VT323', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: linear-gradient(to right, rgba(0, 255, 255, 0.1), rgba(255, 0, 255, 0.1));
            text-shadow: 0 0 2px rgba(0, 255, 255, 0.5);
            box-sizing: border-box;
        }

        .container {
            background-color: rgba(10, 10, 42, 0.85);
            border: 3px solid var(--color-primary);
            box-shadow: var(--shadow-glow), inset 0 0 10px rgba(0, 255, 255, 0.5);
            padding: 40px;
            max-width: 600px;
            width: 90%;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: var(--color-secondary);
            text-shadow: 0 0 15px var(--color-secondary);
            margin-bottom: 20px;
            border-bottom: 1px dashed var(--color-primary);
            padding-bottom: 10px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            color: var(--color-primary);
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid var(--color-primary);
            background-color: rgba(0, 0, 0, 0.5);
            color: var(--color-text);
            box-sizing: border-box;
            font-family: 'VT323', monospace;
            box-shadow: inset 0 0 5px rgba(0, 255, 255, 0.3);
            border-radius: 5px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .rating-group {
            margin-top: 10px;
        }

        .rating-group label {
            margin-right: 20px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .rating-group label:hover {
            color: var(--color-secondary);
            text-shadow: 0 0 8px var(--color-secondary);
        }

        button {
            background-color: var(--color-primary);
            color: var(--color-background);
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 1em;
            margin-top: 20px;
            box-shadow: var(--shadow-glow);
            transition: all 0.3s;
        }

        button:hover {
            background-color: var(--color-secondary);
            box-shadow: 0 0 20px var(--color-secondary);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>[SYSTEM ONLINE] Feedback Terminal <span style="font-size: 0.8em; color: var(--color-primary);">// 2026.04</span></h1>
        <form action="/submit-feedback" method="POST">

            <label for="nombre">Identificador de Usuario (Opcional):</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: Usuario Alpha-7">

            <label for="email">Correo de Contacto (Opcional):</label>
            <input type="email" id="email" name="email" placeholder="usuario@dominio.com">

            <label>Calificación General de la Ponencia:</label>
            <div class="rating-group">
                <input type="radio" id="radio-1" name="calificacion" value="5" required><label for="radio-1">Excelente (5)</label>
                <input type="radio" id="radio-2" name="calificacion" value="4"><label for="radio-2">Bueno (4)</label>
                <input type="radio" id="radio-3" name="calificacion" value="3"><label for="radio-3">Aceptable (3)</label>
                <input type="radio" id="radio-4" name="calificacion" value="2"><label for="radio-4">Pobre (2)</label>
                <input type="radio" id="radio-5" name="calificacion" value="1"><label for="radio-5">Muy Pobre (1)</label>
            </div>

            <label for="opinar">Comentarios Adicionales/Sugerencias (Máx. 500 caracteres):</label>
            <textarea id="opinar" name="comentarios" maxlength="500" placeholder="[INPUT REQUIRED] ¿Qué podemos mejorar o qué fue lo más impactante?"></textarea>

            <button type="submit">ENVIAR FEEDBACK [INITIATE TRANSMISSION]</button>
        </form>
    </div>
</body>
</html>
